[project]
name = "ambient-pipeline"
version = "0.1.0"
description = "episode.yaml -> long.mp4 + short.mp4 + metadata.json + qc.json"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "numpy", "soundfile"]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
