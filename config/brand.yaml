# Channel identity: everything brand-specific lives here. Code, agents and skills assume no brand.
# Fork: edit and commit this file.
# Local clone: config/brand.local.yaml (not tracked in git) overrides this file per field, same schema.
# Precedence: brand < use_cases.yaml < episode.yaml. Setup: /brand-setup
channel:
  name: "Your Channel"
  handle: "@your-handle"      # while this stays a placeholder, agents suggest /brand-setup before producing content
  niche: "ambient soundscapes for sleep, study and relaxation"
  language: en                # language of titles, descriptions, tags and Short texts
  voice: "calm, cinematic, scene-specific; no clickbait"

cadence:
  longs_per_week: 5           # 1 Short per long
  max_variants_per_week: 2    # upper limit for sleep/focus variants

metadata:
  # title pattern for concept-planner; the final title is the episode.yaml `title` field.
  # title_suffix comes from use_cases.yaml (update it there too if the language/niche changes).
  title_pattern: "{scene} | {hours} Hours {genre} {title_suffix}"
  description_footer: ""      # appended to every description (subscribe call, links, license note)
  default_tags: []

short:
  font: assets/fonts/SpaceGrotesk-Medium.ttf
  cta: "Full {hours}h on the channel"   # {hours}, {name}, {handle} are available
  text_color: white
  outline_color: black

watermark:
  file: null                  # e.g. assets/brand/logo.png; null = no watermark
  position: bottom-right
  opacity: 0.6
