# Kanal kimliği: markaya özgü her şey burada. Kod, ajanlar ve skill'ler marka varsaymaz.
# Fork: bu dosyayı düzenleyip commit'le.
# Lokal klon: config/brand.local.yaml (git'e girmez) aynı şemayla alan bazında bu dosyayı ezer.
# Öncelik: brand < use_cases.yaml < episode.yaml. Kurulum: /brand-setup
channel:
  name: "Your Channel"
  handle: "@your-handle"      # placeholder kaldıkça ajanlar içerik üretmeden önce /brand-setup önerir
  niche: "ambient soundscapes for sleep, study and relaxation"
  language: en                # başlık, açıklama, tag ve Short metinlerinin dili
  voice: "calm, cinematic, scene-specific; no clickbait"

cadence:
  longs_per_week: 5           # her long için 1 Short
  max_variants_per_week: 2    # sleep/focus varyantı üst sınırı

metadata:
  # concept-planner için başlık kalıbı; nihai başlık episode.yaml `title` alanıdır.
  # title_suffix use_cases.yaml'dan gelir (dil/niş değişirse orayı da güncelle).
  title_pattern: "{scene} | {hours} Hours {genre} {title_suffix}"
  description_footer: ""      # her açıklamanın sonuna eklenir (abone çağrısı, linkler, lisans notu)
  default_tags: []

short:
  font: assets/fonts/SpaceGrotesk-Medium.ttf
  cta: "Full {hours}h on the channel"   # {hours}, {name}, {handle} kullanılabilir
  text_color: white
  outline_color: black

watermark:
  file: null                  # örn. assets/brand/logo.png; null = watermark yok
  position: bottom-right
  opacity: 0.6
